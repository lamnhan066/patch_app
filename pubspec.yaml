name: patch_app
description: "A lightweight helper to patch your Flutter app at runtime using
  shorebird code push and terminate restart"
version: 0.3.0
homepage: https://github.com/lamnhan066/patch_app

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  shorebird_code_push: ^2.0.6
  terminate_restart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
